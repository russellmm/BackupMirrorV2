  <div class="backdrop-glow" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="favicon.svg" alt="" class="brand-mark">
        <div>
          <div class="brand-name">Backup Mirror</div>
          <div class="brand-sub" id="brand-host">connecting…</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/" data-view="overview"><svg><use href="#i-grid"/></svg><span>Overview</span></a>
        <a href="#/activity" data-view="activity"><svg><use href="#i-activity"/></svg><span>Activity</span></a>
        <a href="#/logs" data-view="logs"><svg><use href="#i-logs"/></svg><span>Service log</span></a>
        <a href="#/settings" data-view="settings"><svg><use href="#i-settings"/></svg><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="service-pill" id="service-pill">
          <span class="dot"></span><span class="label">Connecting</span>
        </div>
        <div class="theme-switch" role="radiogroup" aria-label="Theme">
          <button data-theme-choice="light" title="Light"><svg><use href="#i-sun"/></svg></button>
          <button data-theme-choice="system" title="Match system"><svg><use href="#i-monitor"/></svg></button>
          <button data-theme-choice="dark" title="Dark"><svg><use href="#i-moon"/></svg></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="conn-banner" id="conn-banner" hidden>
        <span class="spinner"></span><span>Lost connection to the Backup Mirror service. Reconnecting…</span>
      </div>
      <header class="topbar">
        <button class="icon-btn mobile-only" data-action="toggle-nav" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
        <div>
          <h1 id="view-title">Overview</h1>
          <p id="view-sub" class="muted"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="layer"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
